name: MCP staging smoke tests

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "src/app/api/mcp/**"
      - "src/features/mcp/**"
      - "src/features/crm-integrations/**"
      - "scripts/mcp-*.mjs"
      - "scripts/mcp-*.ts"
      - "scripts/crm-sync-logic-test.ts"
      - "supabase/migrations/*.sql"
      - ".github/workflows/mcp-staging.yml"

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_APP_URL: http://127.0.0.1:3000
      NEXT_PUBLIC_SITE_URL: http://127.0.0.1:3000
      MCP_TEST_BASE_URL: http://127.0.0.1:3000
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Start isolated Supabase test environment
        run: |
          npx supabase start -x studio,imgproxy,mailpit,edge-runtime,logflare,vector,supavisor
          npx supabase status -o env > /tmp/supabase.env
          source /tmp/supabase.env
          echo "NEXT_PUBLIC_SUPABASE_URL=$API_URL" >> "$GITHUB_ENV"
          echo "NEXT_PUBLIC_SUPABASE_ANON_KEY=$ANON_KEY" >> "$GITHUB_ENV"
          echo "SUPABASE_SERVICE_ROLE_KEY=$SERVICE_ROLE_KEY" >> "$GITHUB_ENV"
      - name: Start Bizcraw
        run: npm run dev > /tmp/bizcraw-next.log 2>&1 &
      - name: Wait for server
        run: |
          for attempt in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3000/login > /dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/bizcraw-next.log
          exit 1
      - run: npm run test:mcp
      - run: npm run test:mcp:oauth
      - run: npm run test:mcp:sdk
      - run: npm run test:mcp:write
      - run: npm run test:mcp:load
      - run: npm run test:mcp:contract
      - run: npm run test:mcp:db-contract
      - run: npm run test:mcp:access
      - run: npm run test:mcp:reliability
      - run: npm run test:crm-sync-logic
      - name: Upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: mcp-staging-server-log
          path: /tmp/bizcraw-next.log
          retention-days: 7
      - name: Stop isolated Supabase test environment
        if: always()
        run: npx supabase stop --no-backup
